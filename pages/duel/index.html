<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.duel">對戰 · TDeck</title>
  <script src="../../wwwroot/js/theme.js"></script>
  <script src="../../wwwroot/js/i18n.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Outfit:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@1,600&amp;family=Playfair+Display:ital,wght@1,700&amp;display=swap">
  <link rel="stylesheet" href="../../wwwroot/lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../wwwroot/lib/bootstrap/bootstrap-modal.min.css">
  <link rel="stylesheet" href="../../wwwroot/css/site.css">
  <link rel="stylesheet" href="../../wwwroot/css/duel.css">
</head>
<body class="duel-page">
  <header id="navbar"></header>

  <main class="duel-lobby">
    <!-- 大廳 -->
    <div id="view-lobby" class="lobby-actions">
      <button type="button" class="btn primary lobby-btn" id="btn-create-room" data-i18n="duel.create">建立房間</button>
      <button type="button" class="btn lobby-btn" id="btn-join-room" data-i18n="duel.join">加入房間</button>
    </div>

    <!-- 建立房間：① 產生連線碼給對手 ② 貼上對手的回覆碼 -->
    <section id="view-host" class="panel room-card" hidden>
      <h2 data-i18n="duel.create">建立房間</h2>
      <div class="step">
        <label class="step-label" for="offer-code" data-i18n="duel.hostStep1">① 把連線碼傳給對手</label>
        <textarea id="offer-code" class="code-box" rows="4" readonly spellcheck="false"></textarea>
        <button type="button" class="btn" id="btn-copy-offer" data-i18n="duel.copyOffer" disabled>複製連線碼</button>
      </div>
      <form class="step" id="answer-form" novalidate>
        <label class="step-label" for="answer-input" data-i18n="duel.hostStep2">② 貼上對手傳回的回覆碼</label>
        <textarea id="answer-input" class="code-box" rows="3" spellcheck="false" autocomplete="off"></textarea>
        <button type="submit" class="btn primary" id="btn-connect" data-i18n="duel.connect" disabled>連線</button>
      </form>
      <p class="room-status" id="host-status"></p>
      <button type="button" class="btn" id="btn-cancel-host" data-i18n="duel.cancel">取消</button>
    </section>

    <!-- 加入房間：① 貼上房主的連線碼 ② 把回覆碼傳回給房主 -->
    <section id="view-join" class="panel room-card" hidden>
      <h2 data-i18n="duel.join">加入房間</h2>
      <form class="step" id="offer-form" novalidate>
        <label class="step-label" for="offer-input" data-i18n="duel.guestStep1">① 貼上房主傳來的連線碼</label>
        <textarea id="offer-input" class="code-box" rows="3" spellcheck="false" autocomplete="off"></textarea>
        <button type="submit" class="btn primary" id="btn-make-answer" data-i18n="duel.makeAnswer">產生回覆碼</button>
      </form>
      <div class="step" id="answer-step" hidden>
        <label class="step-label" for="answer-code" data-i18n="duel.guestStep2">② 把回覆碼傳回給房主</label>
        <textarea id="answer-code" class="code-box" rows="4" readonly spellcheck="false"></textarea>
        <button type="button" class="btn" id="btn-copy-answer" data-i18n="duel.copyAnswer">複製回覆碼</button>
      </div>
      <p class="room-status" id="join-status"></p>
      <button type="button" class="btn" id="btn-cancel-join" data-i18n="duel.cancel">取消</button>
    </section>

    <!-- 已連線 -->
    <section id="view-room" class="panel room-card" hidden>
      <p class="room-status" id="room-status"></p>
      <p class="muted" data-i18n="duel.wip">對戰功能開發中</p>
      <button type="button" class="btn danger" id="btn-leave" data-i18n="duel.leave">離開房間</button>
    </section>
  </main>

  <script src="../../wwwroot/lib/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../../wwwroot/js/common.js"></script>
  <script src="../../wwwroot/js/nav.js"></script>
  <script src="../../wwwroot/js/duel.js"></script>
</body>
</html>
